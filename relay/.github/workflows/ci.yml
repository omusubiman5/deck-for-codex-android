name: Relay CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run self-test
      - if: runner.os == 'Windows'
        run: npm run package:windows
      - if: runner.os == 'macOS'
        run: npm run package:macos
      - uses: actions/upload-artifact@v4
        with:
          name: codex-micro-relay-${{ runner.os }}
          path: release/*.zip*
